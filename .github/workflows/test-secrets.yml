name: Test Secret Access
on: [push]

jobs:
  test-secrets:
    runs-on: ubuntu-latest
    steps:
      - name: "Attempt to access secrets"
        run: |
          echo "=== TESTING WORKFLOW CONTEXT ==="
          echo "Secrets context available: ${{ secrets }}"
          echo "GitHub token available: $([ -z "$GITHUB_TOKEN" ] && echo 'NO' || echo 'YES')"
          if [ ! -z "$GITHUB_TOKEN" ]; then
            echo "Token length: ${#GITHUB_TOKEN}"
          fi
          echo "Environment vars:" 
          env | grep -i github | sort
